{% extends "base.html" %}

{% block title %}Budget Wisely: Settings{% endblock %}

{% block content %}
<div class="all" style="justify-content: center; display: flex; align-items: center; min-height: 60vh;">
    <div class="results" style="max-width: 600px; width: 100%; text-align: center; padding: 4rem 2rem;">
        <i class="fa-solid fa-sliders" style="font-size: 4rem; color: var(--primary); margin-bottom: 1.5rem;"></i>
        <h2 style="margin-bottom: 1rem; color: var(--text-main);">Settings & Preferences</h2>
        <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem; line-height: 1.6;">
            We are working hard to bring you customizable themes, currency selectors, and email preferences. Stay tuned!
        </p>
        <span style="background: var(--bg-body); padding: 0.6rem 1.2rem; border-radius: 20px; font-weight: 600; color: var(--text-muted); display: inline-block;">
            🚀 Coming Soon
        </span>
    </div>
</div>
{% endblock %}
