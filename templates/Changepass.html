<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Wisely: Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Allmessage.css') }}">
    <script src="{{ url_for('static', filename='Javascript/allmessage.js')}}"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon/favicon.png') }}">
</head>
<body>

    <!-- Flash Messages -->
    <div class="message">    
    {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    </div>

    <div class="all">
        <div class="auth-container">
            <h2>Update Password</h2>
            <form method="POST" action="{{ url_for('change_pass') }}">
                <input type="password" name="oldpassword" placeholder="Current password" autocomplete="current-password" required>
                <input type="password" name="newpassword" placeholder="New password" minlength="6" autocomplete="new-password" required>
                <input type="password" name="cpassword" placeholder="Confirm new password" minlength="6" autocomplete="new-password" required>
                <button type="submit">Update Password</button>
            </form>
            <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
        </div>
    </div>
</body>
</html>
